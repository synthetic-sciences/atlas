name: Bug report
description: Report a reproducible problem with Atlas.
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - CLI
        - SDK
        - Graph UI
        - Graph server
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or source commit
      placeholder: "@synsci/atlas 0.16.0, Node.js 22, macOS"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or a small example. Remove credentials and private research data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Relevant logs or screenshots
      description: Redacted details only. Report vulnerabilities through SECURITY.md.
